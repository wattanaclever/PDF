<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAIN</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Space Grotesk & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- PDF.js for rendering PDF page previews -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- pdf-lib for client-side PDF extraction/splitting -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <!-- JSZip for multi-file output downloading -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <script>
        // Configure PDF.js worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Space Grotesk"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace']
                    },
                    colors: {
                        crimson: {
                            50: '#FFF5F5',
                            100: '#FFE3E3',
                            500: '#FF1E42',
                            600: '#E63946',
                            700: '#DC2626',
                            900: '#991B1B'
                        },
                        tech: {
                            white: '#FFFFFF',
                            bg: '#FAF9F6',
                            panel: '#F3F4F6',
                            border: '#E5E7EB',
                            dark: '#0F172A',
                            muted: '#64748B'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #FAF9F6;
            color: #0F172A;
            background-image:
                radial-gradient(rgba(230, 57, 70, 0.05) 1px, transparent 0),
                linear-gradient(to right, rgba(15, 23, 42, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(15, 23, 42, 0.02) 1px, transparent 1px);
            background-size: 24px 24px, 48px 48px, 48px 48px;
        }

        /* High-tech custom scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }

        ::-webkit-scrollbar-track {
            background: #F3F4F6;
        }

        ::-webkit-scrollbar-thumb {
            background: #FF1E42;
            border-radius: 2px;
        }

        .tech-card {
            background: #FFFFFF;
            border: 1px solid #E5E7EB;
            box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.03);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .tech-card:hover {
            border-color: rgba(255, 30, 66, 0.4);
            box-shadow: 0 8px 25px -5px rgba(255, 30, 66, 0.08);
        }

        .red-glow {
            box-shadow: 0 0 15px rgba(255, 30, 66, 0.25);
        }

        .drag-over-active {
            border-color: #FF1E42 !important;
            background-color: #FFF5F5 !important;
        }

        /* Page item selection styling */
        .page-card {
            transition: all 0.2s ease;
        }

        .page-card.selected {
            border-color: #FF1E42 !important;
            background-color: #FFF5F5 !important;
            box-shadow: 0 0 12px rgba(255, 30, 66, 0.2);
        }

        /* Laser Scanline Effect */
        .scanline {
            background: linear-gradient(to bottom,
                    rgba(255, 255, 255, 0),
                    rgba(255, 30, 66, 0.18),
                    rgba(255, 255, 255, 0));
            animation: scan 3s linear infinite;
        }

        @keyframes scan {
            0% {
                transform: translateY(-100%);
            }

            100% {
                transform: translateY(1000%);
            }
        }
    </style>
</head>

<body>
    <!-- START: REDLINE PDF Global Navbar & Navigation Hub -->
    <!-- 1. Top Navbar Header -->
    <nav
        class="bg-gray-950 border-b border-gray-800 h-16 flex-shrink-0 z-40 px-6 flex items-center justify-between font-sans text-xs text-white relative">
        <!-- ฝั่งซ้าย: โลโก้แบรนด์ -->
        <div class="flex items-center gap-3">
            <a href="index.html" class="flex items-center gap-2.5">
                <div
                    class="w-9 h-9 rounded-xl bg-red-600 flex items-center justify-center text-white font-bold text-lg shadow-lg">
                    <i class="fa-solid fa-file-pdf"></i>
                </div>
                <span class="text-base font-extrabold tracking-wider">CLEVER<span
                        class="text-red-500">TENSAI</span></span>
            </a>
        </div>

        <!-- ตรงกลาง: ปุ่มเปิด Popup สลับหน้าเครื่องมือ -->
        <div class="absolute left-1/2 transform -translate-x-1/2">
            <button onclick="toggleNavPopup()"
                class="px-5 py-2.5 bg-gray-900 hover:bg-gray-800 border border-gray-700 rounded-full font-bold flex items-center gap-2.5 text-gray-100 transition-all shadow-md group text-sm">
                <i class="fa-solid fa-th text-red-500 group-hover:scale-110 transition-transform"></i>
                <span>All Tools Hub</span>
                <i class="fa-solid fa-chevron-down text-xs text-gray-400"></i>
            </button>
        </div>

        <!-- ฝั่งขวา: โปรไฟล์ผู้ใช้ / สถานะระบบ -->
        <div class="flex items-center gap-3">
            <span class="hidden md:inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"
                title="System Online"></span>
            <div
                class="w-9 h-9 rounded-full bg-gray-800 border border-gray-700 flex items-center justify-center text-gray-300 font-bold cursor-pointer hover:border-red-500 transition-colors">
                <i class="fa-regular fa-user text-sm"></i>
            </div>
        </div>
    </nav>

    <!-- 2. Seniors-Friendly Large Navigation Modal Hub -->
    <div id="navPopupModal"
        class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 sm:p-6 animate-fadeIn">
        <div
            class="bg-gray-900 border-2 border-gray-800 rounded-3xl max-w-3xl w-full p-6 sm:p-8 shadow-2xl relative text-white font-sans">

            <!-- Header ของ Modal -->
            <div class="flex items-center justify-between pb-6 border-b border-gray-800">
                <div class="flex items-center gap-3">
                    <div
                        class="w-12 h-12 rounded-2xl bg-red-600/20 text-red-500 flex items-center justify-center text-2xl border border-red-500/30">
                        <i class="fa-solid fa-th"></i>
                    </div>
                    <div>
                        <h3 class="text-xl sm:text-2xl font-extrabold text-white tracking-wide">
                            Select PDF Tool
                        </h3>
                        <p class="text-sm text-gray-400 mt-1">เลือกเครื่องมือจัดการเอกสารที่คุณต้องการใช้งาน</p>
                    </div>
                </div>

                <!-- ปุ่มปิดขนาดใหญ่ -->
                <button onclick="toggleNavPopup()"
                    class="w-12 h-12 rounded-2xl bg-gray-800 hover:bg-red-600/20 border border-gray-700 hover:border-red-500/50 text-gray-400 hover:text-red-400 flex items-center justify-center transition-all text-xl">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- รายการเครื่องมือหลัก 3 ตัว -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 sm:gap-6 py-6 sm:py-8">

                <!-- 1. Merge PDF -->
                <a href="MergePDF.html"
                    class="p-6 rounded-2xl bg-gray-800/60 hover:bg-red-600/15 border-2 border-gray-800 hover:border-red-500/60 transition-all flex flex-col items-center text-center group shadow-lg">
                    <div
                        class="w-16 h-16 rounded-2xl bg-red-600/20 text-red-500 group-hover:bg-red-600 group-hover:text-white flex items-center justify-center text-3xl mb-4 transition-all duration-200 group-hover:scale-110 shadow-md">
                        <i class="fa-solid fa-object-ungroup"></i>
                    </div>
                    <span class="font-extrabold text-lg text-gray-100 group-hover:text-red-400 tracking-wide">Merge
                        PDF</span>
                    <span
                        class="text-xs text-gray-400 mt-2 font-medium leading-relaxed">รวมไฟล์เอกสารหลายหน้าเข้าด้วยกันเป็นเล่มเดียว</span>
                </a>

                <!-- 2. Split PDF -->
                <a href="SplitPDF.html"
                    class="p-6 rounded-2xl bg-gray-800/60 hover:bg-red-600/15 border-2 border-gray-800 hover:border-red-500/60 transition-all flex flex-col items-center text-center group shadow-lg">
                    <div
                        class="w-16 h-16 rounded-2xl bg-red-600/20 text-red-500 group-hover:bg-red-600 group-hover:text-white flex items-center justify-center text-3xl mb-4 transition-all duration-200 group-hover:scale-110 shadow-md">
                        <i class="fa-solid fa-scissors"></i>
                    </div>
                    <span class="font-extrabold text-lg text-gray-100 group-hover:text-red-400 tracking-wide">Split
                        PDF</span>
                    <span
                        class="text-xs text-gray-400 mt-2 font-medium leading-relaxed">แยกหน้าหรือตัดเลือกบางส่วนของเอกสาร
                        PDF</span>
                </a>

                <!-- 3. Edit PDF -->
                <a href="EditPDF.html"
                    class="p-6 rounded-2xl bg-gray-800/60 hover:bg-red-600/15 border-2 border-gray-800 hover:border-red-500/60 transition-all flex flex-col items-center text-center group shadow-lg">
                    <div
                        class="w-16 h-16 rounded-2xl bg-red-600/20 text-red-500 group-hover:bg-red-600 group-hover:text-white flex items-center justify-center text-3xl mb-4 transition-all duration-200 group-hover:scale-110 shadow-md">
                        <i class="fa-solid fa-pen-to-square"></i>
                    </div>
                    <span class="font-extrabold text-lg text-gray-100 group-hover:text-red-400 tracking-wide">Edit
                        PDF</span>
                    <span class="text-xs text-gray-400 mt-2 font-medium leading-relaxed">เขียน วาด พิมพ์
                        และเติมข้อความบนหน้า PDF</span>
                </a>

            </div>


        </div>
    </div>

    <!-- 3. Script ควบคุมการเปิด/ปิด Modal -->
    <script>
        function toggleNavPopup() {
            const modal = document.getElementById('navPopupModal');
            if (modal) {
                modal.classList.toggle('hidden');
            }
        }
    </script>
    <!-- END: REDLINE PDF Global Navbar & Navigation Hub -->

</html>
